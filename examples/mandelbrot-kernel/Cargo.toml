[package]
name = "mandelbrot-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mandelbrot set image kernel — an example of packaging a claspr kernel as a reusable library crate"

[lib]

[dependencies]
claspr = { path = "../../claspr" }
claspr-async = { path = "../../claspr-async" }
# `num-complex` is also pulled into the generated kernel sub-crate by
# claspr-build, but we list it here as a regular host dep too so the
# `mandelbrot_iter` helper is callable from both sides without a cfg
# gate (host validation, doctests, etc).
num-complex = { version = "0.4", default-features = false }

[build-dependencies]
claspr-build = { path = "../../claspr-build" }

[lints]
workspace = true
