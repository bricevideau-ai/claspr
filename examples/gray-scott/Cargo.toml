[package]
name = "gray-scott-example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Gray-Scott reaction-diffusion — claspr Tier 2 graph-as-reusable-meta-kernel flagship demo"

[[bin]]
name = "gray_scott_example"
path = "src/main.rs"

# Read-only debug tool: dumps the per-step graph STRUCTURE (indented tree + pipe
# edge table) so the shared fan-out pipe edges are visible. Shares this crate's
# OUT_DIR/gpu.rs (one build.rs per crate). Does not run on a device.
[[bin]]
name = "dump_graph"
path = "src/bin/dump_graph.rs"

[dependencies]
claspr = { path = "../../claspr" }

[build-dependencies]
claspr-build = { path = "../../claspr-build" }

[lints]
workspace = true
