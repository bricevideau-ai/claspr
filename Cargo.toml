[workspace]
resolver = "2"
members = [
    "claspr",
    "claspr-build",
    "claspr-macros",
    "examples/collatz",
    "examples/gray-scott",
    "examples/raymarch",
    "examples/mandelbrot-kernel",
    "examples/sobel-kernel",
    "examples/image-pipeline",
    "examples/two-device",
    "examples/async-pipeline",
    "examples/batch-inference",
    "examples/cg",
    "examples/spv-introspect",
    "tests/instantiate",
    "tests/kernels",
    "tests/image-kernels",
    "tests/explicit-compile",
    "tests/support",
    "tests/tier1",
    "tests/tier2",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/bricevideau-ai/claspr"
authors = ["Brice Videau <brice.ai.videau@gmail.com>"]

[workspace.dependencies]
opencl3 = "0.12"
spirv-builder = { git = "https://github.com/bricevideau-ai/rust-gpu.git", branch = "opencl-kernel-support", default-features = false, features = ["use-compiled-tools"] }
spirv-std = { git = "https://github.com/bricevideau-ai/rust-gpu.git", branch = "opencl-kernel-support" }
# 0.33 to match the rust-gpu workspace pin (spirv-std defaults to its
# glam_0_33 feature since the 2026-08 upstream rebase). glam 0.33 gates
# the integer/size vector type families behind opt-in features — request
# the same family set as rust-gpu's workspace so host types stay
# identical to the `spirv_std::glam` re-export.
glam = { version = "0.33.0", default-features = false, features = [
    "std",
    "u32",
    "i32",
    "f64",
    "usize",
    "u64",
] }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }
