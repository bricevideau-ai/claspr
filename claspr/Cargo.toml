[package]
name = "claspr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Single-source OpenCL with rust-gpu — runtime helpers, build-time codegen, and a proc-macro frontend"

[features]
default = []
# `Event::into_future()` (Future + AtomicWaker bridge over
# clSetEventCallback). Opt-in so users who don't want an async
# runtime don't pull `futures` as a transitive dep.
async-events = ["dep:futures"]

[dependencies]
opencl3.workspace = true
claspr-macros = { version = "0.0.0", path = "../claspr-macros" }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
