[package]
name = "claspr-tier1-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Integration tests for claspr's Tier 1 runtime surface (LaunchOp, Context, Queue, …)"

# Empty library shell so `tests/*.rs` files are discovered as
# integration tests. No public API.
[lib]
path = "src/lib.rs"

[dependencies]
claspr = { path = "../../claspr" }
claspr-test-kernels = { path = "../kernels" }
claspr-test-image-kernels = { path = "../image-kernels" }
# Shared test helpers (ctx()/skip discipline, two-device discovery) +
# the ui_test harness plumbing behind the `ui-test` feature.
claspr-test-support = { path = "../support", features = ["ui-test"] }

[dev-dependencies]
# For block_on / noop_waker in the Tier-1 async-surface tests
# (async_event.rs) — same crate claspr's `async-events` feature uses.
futures = "0.3"

# `ui_test` requires harness = false so its `fn main()` actually runs
# instead of cargo test looking for `#[test]`s. The test crate `image_compile_fail`
# lives in `tests/image_compile_fail.rs` as before; only the harness mode changes.
[[test]]
name = "image_compile_fail"
path = "tests/image_compile_fail.rs"
harness = false

[lints]
workspace = true
