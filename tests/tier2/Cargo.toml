[package]
name = "claspr-tier2-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Integration tests for claspr's Tier 2 device-graph API"

[lib]
path = "src/lib.rs"

[dependencies]
claspr = { path = "../../claspr" }
claspr-test-kernels = { path = "../kernels" }

[dev-dependencies]
# Just for `block_on` in the async-terminal tests — no need for tokio's
# full machinery.
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
ui_test = "0.30"
# Write-only IMAGE kernel for the home-invariant no-seed scenario (scenario 4).
claspr-test-image-kernels = { path = "../image-kernels" }

# `ui_test` requires harness = false so its `fn main()` runs instead of cargo
# looking for `#[test]`s. Mirrors `tests/tier1`'s `image_compile_fail`.
[[test]]
name = "safety_compile_fail"
path = "tests/safety_compile_fail.rs"
harness = false

[lints]
workspace = true
