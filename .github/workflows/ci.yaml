on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Enable the llvmpipe back-end of rusticl, installed below via
      # `mesa-opencl-icd`. Required for the workspace tests + the
      # combinator spike to find a SPIR-V-capable OpenCL device;
      # `fp64` enables the f64-using tests (e.g. nbody-style chains,
      # SVM tests with f64 buffers). The fmt / clippy / build steps
      # don't need the runtime, but setting the env job-wide keeps
      # the surface uniform.
      RUSTICL_ENABLE: llvmpipe
      RUSTICL_FEATURES: fp64
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Install rusticl OpenCL ICD
        run: |
          sudo apt-get update -y -qq
          # `kisak-mesa` ships the rusticl OpenCL ICD via
          # `mesa-opencl-icd`; older Ubuntu archives do not.
          sudo add-apt-repository ppa:kisak/kisak-mesa -y
          sudo apt-get update
          sudo apt install -y mesa-opencl-icd

      # Compute the host triple and pass it as `--target $TARGET` to
      # every build/clippy/test step. Cargo issue #6313: when host ==
      # target *implicitly*, the host build-dep dylib
      # `librustc_codegen_spirv.so` (pulled by `claspr-build` as a
      # build-dep of multiple workspace members) ends up scheduled
      # twice in the same output dir and cargo warns about a
      # collision. Specifying `--target` explicitly — even with the
      # host triple — opts cargo into a separate host build-dep dep
      # graph that resolves to a distinct output path.
      - name: install rust-toolchain
        run: echo "TARGET=$(rustc --print host-tuple)" >> "$GITHUB_ENV"

      - name: cargo fetch --locked
        run: cargo fetch --locked --target $TARGET

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --target $TARGET -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace --target $TARGET

      - name: cargo test --workspace
        # Workspace covers claspr unit tests, the tier1 / tier2
        # integration test suites, and the small async-pipeline /
        # batch-inference examples' inline tests. Tests that need an
        # OpenCL device skip gracefully if none is present, but with
        # rusticl installed above they actually execute.
        run: cargo test --workspace --release --target $TARGET
