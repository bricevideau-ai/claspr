on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Enable the llvmpipe back-end of rusticl, installed below via
      # `mesa-opencl-icd`. Required for the workspace tests + the
      # combinator spike to find a SPIR-V-capable OpenCL device;
      # `fp64` enables the f64-using tests (e.g. nbody-style chains,
      # SVM tests with f64 buffers). The fmt / clippy / build steps
      # don't need the runtime, but setting the env job-wide keeps
      # the surface uniform.
      RUSTICL_ENABLE: llvmpipe
      RUSTICL_FEATURES: fp64
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Install rusticl OpenCL ICD
        run: |
          sudo apt-get update -y -qq
          # `kisak-mesa` ships the rusticl OpenCL ICD via
          # `mesa-opencl-icd`; older Ubuntu archives do not.
          sudo add-apt-repository ppa:kisak/kisak-mesa -y
          sudo apt-get update
          sudo apt install -y mesa-opencl-icd

      # Compute the host triple and pass it as `--target $TARGET` to
      # every build/clippy/test step. Cargo issue #6313: when host ==
      # target *implicitly*, the host build-dep dylib
      # `librustc_codegen_spirv.so` (pulled by `claspr-build` as a
      # build-dep of multiple workspace members) ends up scheduled
      # twice in the same output dir and cargo warns about a
      # collision. Specifying `--target` explicitly — even with the
      # host triple — opts cargo into a separate host build-dep dep
      # graph that resolves to a distinct output path.
      - name: install rust-toolchain
        run: echo "TARGET=$(rustc --print host-tuple)" >> "$GITHUB_ENV"

      - name: cargo fetch --locked
        run: cargo fetch --locked --target $TARGET

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # `cargo fmt --all` only walks the workspace member sources; the
      # trybuild compile-fail fixtures under tests/*/compile_fail/*.rs
      # aren't part of any [lib]/[[bin]] tree, so `cargo fmt` skips
      # them. Run rustfmt directly on the fixtures to keep import
      # ordering / whitespace consistent.
      - name: Rustfmt (compile-fail fixtures)
        run: |
          fixtures=$(find tests/*/compile_fail -name '*.rs' 2>/dev/null || true)
          if [ -n "$fixtures" ]; then
            echo "$fixtures" | xargs rustfmt --check
          fi

      # `--release` so the artifact cache produced here is reused
      # verbatim by the build + test steps below — without the flag,
      # clippy compiled the whole workspace in debug, then cargo test
      # --release recompiled it all from scratch (two full passes per
      # CI run). Release-mode clippy is a hair slower but it pays for
      # the build + test steps almost entirely.
      - name: Clippy
        run: cargo clippy --release --all-targets --target $TARGET -- -D warnings

      # `cargo doc` warnings as errors — catches broken intra-doc
      # links, ambiguous symbol references (module-vs-macro,
      # function-vs-module), and stale method references in
      # docstrings. --no-deps skips ~minutes of doc-building for
      # external crates we don't control. --release matches the
      # clippy + build + test profile so this step reuses their
      # cache instead of triggering a full debug recompile.
      - name: Cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --release --target $TARGET

      # Build in release so the artifact cache is reused verbatim by
      # the `cargo test --release` step below. Same profile = zero
      # rebuild between the two steps.
      - name: cargo build --workspace --release
        run: cargo build --workspace --release --target $TARGET

      - name: cargo test --workspace
        # Workspace covers claspr unit tests, the tier1 / tier2
        # integration test suites, and the small async-pipeline /
        # batch-inference examples' inline tests. Tests that need an
        # OpenCL device skip gracefully if none is present, but with
        # rusticl installed above they actually execute. `--release`
        # matches the build step above so artifacts are reused —
        # release also surfaces a handful of kernel-codegen issues
        # that don't appear in debug.
        run: cargo test --workspace --release --target $TARGET
