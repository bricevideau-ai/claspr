[package]
name = "claspr-async"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tier 2 combinator API on top of claspr — DeviceOperation + and_then + bundle + fan_out, lazy-execution model with sync and async terminals"

[lib]
path = "src/lib.rs"

[dependencies]
# `async-events` enables claspr::EventFuture, which claspr-async's
# `.run().await` builds on. It's the whole point of this crate, so the
# feature is on unconditionally.
claspr = { path = "../claspr", features = ["async-events"] }

[lints]
workspace = true
