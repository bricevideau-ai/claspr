[package]
name = "claspr-async"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compatibility shim — the Tier 2 combinator API folded into `claspr`. Re-exports `claspr` so existing `claspr_async::…` paths keep working."

[lib]
path = "src/lib.rs"

[dependencies]
# The Tier 2 layer now lives in `claspr`; this crate is a thin re-export shim
# kept so existing `claspr_async::` paths resolve. `async-events` is default-on
# in claspr now.
claspr = { path = "../claspr" }

[lints]
workspace = true
