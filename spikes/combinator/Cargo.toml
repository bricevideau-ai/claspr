[package]
name = "claspr-combinator-spike"
version = "0.0.0"
edition = "2024"

# Standalone workspace — the spike isn't part of the main claspr
# workspace (CLAUDE.md / spikes/README.md document the convention).
[workspace]

[dependencies]
# Tracks the in-tree claspr crates by relative path so this spike
# always exercises the latest API. Originally the spike faked the
# whole Tier 2 framework in-tree; now it consumes the real one.
claspr = { path = "../../claspr" }
claspr-async = { path = "../../claspr-async" }
pollster = "0.4"

[build-dependencies]
claspr-build = { path = "../../claspr-build" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }
